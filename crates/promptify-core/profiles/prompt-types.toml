negatives = ["Fix the formula in cell A1", "Explain how this function works"]
rewrite = "Debug the checkout crash.\nStep 1: Reproduce the crash and identify its root cause from the code and available evidence.\nStep 2 (after 1): Apply a minimal fix and add or run a relevant regression test.\nLoop: if the completion criteria are not met, return to Step 2 (max 2 rounds).\nDone when: The checkout issue is addressed, relevant checks pass, and any unverified behavior is reported honestly."

