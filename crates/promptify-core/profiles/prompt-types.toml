[[task]]
id = "writing.draft"
family = "Writing and editing"
label = "Draft prose for a defined purpose"
inputs = "Purpose, audience, facts, length"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:write|draft|compose)\\b.*\\b(?:article|essay|paragraph|blog post|prose|text|script)\\b"]
instructions = "Request the text for the user's purpose, audience and constraints. Preserve supplied facts; leave missing facts open. Write only the instructions, not the final prose."
examples = ["Draft an article about urban gardens", "Write an essay about renewable energy", "Compose a paragraph for our introduction", "Write a video script for a product tutorial"]
negatives = ["Write an email to the team", "Write a Python function"]
exclude = ["\\b(?:python|shell|bash|powershell|javascript)\\s+script\\b"]
rewrite = "Draft an article about urban gardens.\nStep 1: Draft the article using supplied facts and audience details without inventing examples, statistics or quotations.\nStep 2 (after 1): Review topic coverage, clarity and support for factual claims.\nLoop: if Step 2 fails the topic or factual-support checks, return to Step 1 to revise unclear passages and unsupported claims; then recheck Step 2 (max 2 rounds).\nDone when: the article addresses urban gardens clearly and its factual claims are supported. Stop on passing checks; at the limit report missing evidence."

