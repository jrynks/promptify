[[task]]
id = "writing.shorten"
family = "Writing and editing"
label = "Shorten text while retaining key meaning"
inputs = "Source, target length, protected details"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:shorten|condense|make (?:it|this|that|the text) (?:shorter|concise)|cut (?:it|this) down)\\b"]
instructions = "Ask for a shorter version while preserving key meaning, named facts, numbers and commitments. Preserve a requested length rather than making one up."
examples = ["Shorten this paragraph", "Condense the draft", "Make it shorter", "Cut this down without losing the key facts"]
negatives = ["Summarize this report", "Expand the introduction"]
rewrite = "Shorten this paragraph.\nStep 1: Make the paragraph more concise without losing its meaning, key facts or commitments.\nStep 2 (after 1): Compare with the original for reduced length and preservation of meaning, names and numbers.\nLoop: if Step 2 fails the concision or meaning-preservation checks, return to Step 1 to restore missing details and remove redundancy; then recheck Step 2 (max 2 rounds).\nDone when: the paragraph is shorter while preserving meaning, facts and commitments. Stop on passing checks; at the limit report unresolved tradeoffs."

[[task]]
id = "writing.proofread"
family = "Writing and editing"
label = "Correct spelling and grammar without rewriting intent"
inputs = "Source, language variant, edit scope"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:proofread|fix (?:the |my )?(?:grammar|spelling)|correct (?:the |my )?(?:grammar|spelling)|check (?:the |my )?spelling)\\b"]
instructions = "Request spelling and grammar corrections with minimal changes to meaning, voice and commitments. Use the specified language variant."
examples = ["Proofread my draft", "Fix the grammar in this paragraph", "Correct spelling in this letter", "Check my spelling"]
negatives = ["Debug the parser", "Change the tone to friendly"]
rewrite = "Proofread my draft.\nStep 1: Correct spelling, grammar and punctuation with minimal changes to meaning and voice.\nStep 2 (after 1): Compare the changes with the draft and check remaining errors and unintended meaning changes.\nLoop: if Step 2 fails the correctness or minimal-change checks, return to Step 1 to correct missed errors and restore altered meaning; then recheck Step 2 (max 2 rounds).\nDone when: language errors are corrected without changing meaning or voice. Stop on passing checks; at the limit report ambiguities."

