suppresses = ["code.implement", "writing.draft"]
rewrite = "Build a React component for sign in.\nStep 1: Inspect project conventions and implement the React sign-in component with relevant coverage using the supplied interface, without inventing authentication endpoints.\nStep 2 (after 1): Run checks and verify supported sign-in states, keyboard access and behavior.\nLoop: if Step 2 fails the interaction or accessibility checks, return to Step 1 to correct the component and affected coverage; then recheck Step 2 (max 2 rounds).\nDone when: the React sign-in component integrates with the supplied interface and relevant checks pass. Stop on passing checks; at the limit report unsupported integration or verification gaps."

