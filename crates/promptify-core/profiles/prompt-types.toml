label = "Extract named fields from supplied records"
inputs = "Source, field schema, null/unknown rules"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:extract (?:the |these |all )?(?:fields|names|dates|amounts|entities)|structured extraction|parse (?:this |the |an? )?invoice|convert (?:these |the )?records (?:to|into) json)\\b"]
instructions = "Specify the required fields and schema, source references, provenance and null/unknown policy. Ask the destination to extract only supported values, without inventing missing information."
examples = ["Extract the fields from these invoices", "Extract names and dates from this text", "Parse this invoice into structured data", "Convert these records into JSON"]
negatives = ["Extract action items from this meeting", "Classify support tickets"]
rewrite = "Extract the fields from these invoices.\nStep 1: Extract fields into my supplied schema with source references and its missing-value policy; request the schema if absent instead of inventing fields.\nStep 2 (after 1): Verify field coverage, schema conformity and each value against its invoice.\nLoop: if Step 2 fails the schema or source-value checks, return to Step 1 to correct values, provenance or missing-value handling; then recheck Step 2 (max 2 rounds).\nDone when: extracted fields conform to my schema and values have invoice support or explicit missing status. Stop on passing checks; at the limit report gaps."

