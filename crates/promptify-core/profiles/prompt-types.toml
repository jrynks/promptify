[[task]]
id = "writing.tone"
family = "Writing and editing"
label = "Change tone while preserving commitments and facts"
inputs = "Source, desired tone, protected details"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:change (?:the )?tone|make (?:it|this|that) (?:warmer|friendlier|more formal|more professional)|rewrite\\b.*\\b(?:friendly|formal|professional|warm)|professional tone)\\b"]
instructions = "Request the stated tone while preserving facts, obligations, promises and intent. Do not invent a relationship or change what the user is committing to."
