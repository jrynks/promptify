[[task]]
id = "code.implement"
family = "Software development"
label = "Implement a feature without unrelated changes"
inputs = "Requirements, repository context, tests"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\bimplement\\b", "\\b(?:build|create|write|add)\\b.*\\b(?:function|endpoint|api|service|parser|python script|shell script|feature)\\b"]
instructions = "Request implementation of the stated behavior in the named codebase and stack. Preserve scope, existing behavior and constraints; require relevant tests and verification, not unrelated rewrites."
examples = ["Implement retry support for the client", "Write a Python function to parse dates", "Build an API endpoint for search", "Add a feature to export records"]
negatives = ["Explain this Python function", "Build a React component"]
suppresses = ["writing.draft"]
rewrite = "Implement retry support for the client.\nStep 1: Inspect the existing client behavior, relevant code, and tests.\nStep 2 (after 1): Make a scoped implementation using existing patterns and run relevant tests.\nLoop: if the completion criteria are not met, return to Step 2 (max 2 rounds).\nDone when: Retry support meets the request, existing behavior is preserved, and relevant checks pass or remaining failures are reported."

[[task]]
id = "code.explain"
family = "Software development"
label = "Explain existing code and its behavior"
inputs = "Code reference, audience, scope"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:explain|walk me through|what does)\\b.*\\b(?:code|function|method|class|module|script|algorithm|component)\\b"]
instructions = "Request an explanation of the referenced code's purpose, flow, assumptions and relevant edge cases at the user's level. Do not modify code unless requested."
examples = ["Explain this Python function", "Walk me through the code", "What does this module do", "Explain the algorithm in this class"]
negatives = ["Implement a function", "Explain how a heat pump works"]
suppresses = ["info.explain"]
rewrite = "Explain this Python function.\nStep 1: Explain this Python function's purpose, control flow, assumptions, and relevant edge cases. Use the code I provide and do not modify it.\nStep 2 (after 1): Check the result against the user's stated requirements.\nLoop: if the completion criteria are not met, return to Step 2 (max 2 rounds).\nDone when: The request is fulfilled faithfully, with verification or remaining limitations reported."

