label = "Request a presentation with a coherent narrative"
inputs = "Topic, audience, purpose, length if specified"
priority = "P1"
feasibility = "F2"
status = "enabled"
form = "graph"
patterns = ["\\b(?:create|make|build|draft|generate)\\b.*\\b(?:presentation|slide deck|slides)\\b"]
instructions = "Request a presentation tailored to the audience and purpose, with a coherent narrative and the supplied content, style and length constraints. Refer to files only as supplied; do not assume a specific mode accepts attachments."
examples = ["Create a presentation for the board", "Make a slide deck about our product", "Build slides for a training session", "Draft a presentation from this outline"]
negatives = ["Write an email to the board", "Summarize this slide deck"]
suppresses = ["writing.draft", "code.implement"]
rewrite = "Create a presentation for the board.\nStep 1: Create a presentation for the board using the content and objectives I provide. Build a clear narrative with decision-relevant information, and do not invent figures, sources, or a slide count.\nStep 2 (after 1): Review the artifact against the requested content, audience, narrative, and constraints.\nLoop: if the completion criteria are not met, return to Step 2 (max 2 rounds).\nDone when: The request is fulfilled faithfully, with verification or remaining limitations reported."

