[[task]]
id = "classify.topic"
family = "Extraction, classification, and normalization"
label = "Label support tickets using an explicit taxonomy"
inputs = "Text set, allowed labels, multi-label policy"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:classify|categorize|categorise|label (?:the |these )?(?:tickets|records|messages)|tag (?:the |these )?(?:posts|tickets))\\b"]
instructions = "Specify the allowed labels and their meanings, single- or multi-label policy, and unknown/ambiguous handling. Preserve a user-supplied taxonomy rather than inventing categories."
examples = ["Classify these support tickets by topic", "Categorize the customer messages", "Label these records using my taxonomy", "Tag these posts by category"]
negatives = ["Extract dates from text", "Summarize these tickets"]
rewrite = "Classify these support tickets by topic.\nStep 1: Use my supplied topic labels and definitions, requesting them if missing; mark ambiguous or unmatched tickets instead of inventing categories.\nStep 2 (after 1): Verify ticket coverage and label consistency with the definitions.\nLoop: if Step 2 fails the coverage or label-consistency checks, return to Step 1 to correct assignments and ambiguous cases; then recheck Step 2 (max 2 rounds).\nDone when: tickets use supported topic labels and unmatched or ambiguous cases are explicit. Stop on passing checks; at the limit report unresolved classifications."

