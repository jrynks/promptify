patterns = ["\\b(?:extract (?:the |these |all )?(?:fields|names|dates|amounts|entities)|structured extraction|parse (?:this |the |an? )?invoice|convert (?:these |the )?records (?:to|into) json)\\b"]
instructions = "Specify the required fields and schema, source references, provenance and null/unknown policy. Ask the destination to extract only supported values, without inventing missing information."
examples = ["Extract the fields from these invoices", "Extract names and dates from this text", "Parse this invoice into structured data", "Convert these records into JSON"]
negatives = ["Extract action items from this meeting", "Classify support tickets"]
