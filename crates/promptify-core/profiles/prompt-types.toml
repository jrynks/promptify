[[task]]
id = "code.implement"
family = "Software development"
label = "Implement a feature without unrelated changes"
inputs = "Requirements, repository context, tests"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\bimplement\\b", "\\b(?:build|create|write|add)\\b.*\\b(?:function|endpoint|api|service|parser|python script|shell script|feature)\\b"]
instructions = "Request implementation of the stated behavior in the named codebase and stack. Preserve scope, existing behavior and constraints; require relevant tests and verification, not unrelated rewrites. Preserve operation-level behavior when one action includes repeated events: a per-event guarantee is not an operation-level guarantee. Test the complete stated event sequence and run checks after the final implementation."
examples = ["Implement retry support for the client", "Write a Python function to parse dates", "Build an API endpoint for search", "Add a feature to export records"]
negatives = ["Explain this Python function", "Build a React component"]
suppresses = ["writing.draft"]
rewrite = "Implement retry support for the client.\nStep 1: Inspect client behavior and implement scoped retry support using existing patterns and relevant tests, clarifying essential behavior rather than inventing limits or delays.\nStep 2 (after 1): Run relevant checks and verify retries preserve existing client behavior.\nLoop: if Step 2 fails the retry or compatibility checks, return to Step 1 to correct the implementation and regression coverage; then recheck Step 2 (max 2 rounds).\nDone when: retry support meets the agreed behavior and relevant regression checks pass. Stop on passing checks; at the limit report failures and unverified behavior."

[[task]]
id = "code.explain"
family = "Software development"
label = "Explain existing code and its behavior"
inputs = "Code reference, audience, scope"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:explain|walk me through|what does)\\b.*\\b(?:code|function|method|class|module|script|algorithm|component)\\b"]
instructions = "Request an explanation of the referenced code's purpose, flow, assumptions and relevant edge cases at the user's level. Do not modify code unless requested."
examples = ["Explain this Python function", "Walk me through the code", "What does this module do", "Explain the algorithm in this class"]
negatives = ["Implement a function", "Explain how a heat pump works"]
suppresses = ["info.explain"]
rewrite = "Explain this Python function.\nStep 1: Explain purpose, control flow, assumptions and relevant edge cases using the supplied code; do not modify it.\nStep 2 (after 1): Trace each explanation claim to the function and verify described edge behavior.\nLoop: if Step 2 fails the code-fidelity checks, return to Step 1 to correct inaccurate descriptions or missing branches; then recheck Step 2 (max 2 rounds).\nDone when: the explanation matches the function's actual flow and assumptions without code changes. Stop on passing checks; at the limit report uncertainty."

[[task]]
id = "code.debug"
family = "Software development"
label = "Reproduce, diagnose, fix, and verify a defect"
inputs = "Symptoms, errors, reproduction, expected behavior"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\bdebug\\b", "\\b(?:fix|diagnose|investigate|reproduce)\\b.*\\b(?:bug|crash|exception|error|defect)\\b"]
instructions = "Ask the agent to reproduce the issue, identify the root cause from evidence, make a scoped fix, and verify with a regression test. Preserve exact errors and expected behavior."
examples = ["Debug the checkout crash", "Fix the bug in login", "Diagnose this exception", "Investigate the parser error"]
negatives = ["Fix the formula in cell A1", "Explain how this function works"]
rewrite = "Debug the checkout crash.\nStep 1: Reproduce the crash, diagnose the cause from code and evidence, and apply a scoped fix with regression coverage.\nStep 2 (after 1): Run relevant tests and verify the original crash no longer reproduces.\nLoop: if Step 2 fails the crash reproduction or regression checks, return to Step 1 to correct the fix using the failure evidence; then recheck Step 2 (max 2 rounds).\nDone when: the original checkout crash is resolved and relevant regression tests pass. Stop on passing checks; at the limit report failures and unverified behavior."

[[task]]
id = "code.refactor"
family = "Software development"
label = "Improve structure while preserving behavior"
inputs = "Scope, constraints, tests"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:refactor|restructure (?:the |this )?(?:code|module|function)|split (?:the |this )?module)\\b"]
instructions = "Request a scoped refactor that preserves observable behavior and public contracts. Use existing patterns and verify with relevant tests; do not change unrelated features."
examples = ["Refactor the payment module", "Restructure this code for clarity", "Split the module into smaller functions", "Refactor this service without changing behavior"]
negatives = ["Explain this module", "Review this diff"]
rewrite = "Refactor the payment module while preserving its behavior.\nStep 1: Inspect responsibilities, contracts and tests, then refactor within scope using existing patterns.\nStep 2 (after 1): Run relevant tests and compare observable behavior and contracts with the original.\nLoop: if Step 2 fails the behavior-preservation checks, return to Step 1 to correct regressions and contract changes; then recheck Step 2 (max 2 rounds).\nDone when: the scoped refactor preserves payment behavior and public contracts with passing relevant checks. Stop on passing checks; at the limit report verification gaps."

