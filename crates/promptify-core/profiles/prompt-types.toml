rewrite = "Create a presentation for the board.\nStep 1: Create a coherent presentation using my supplied content and objectives without inventing figures, sources or a slide count.\nStep 2 (after 1): Verify objective coverage, board relevance and factual support.\nLoop: if Step 2 fails the coverage or factual-support checks, return to Step 1 to revise the presentation and unsupported claims; then recheck Step 2 (max 2 rounds).\nDone when: the presentation covers my objectives coherently with supported content for the board. Stop on passing checks; at the limit report gaps."

