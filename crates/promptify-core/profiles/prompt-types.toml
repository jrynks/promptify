priority = "P1"
feasibility = "F2"
status = "enabled"
form = "graph"
patterns = ["\\b(?:build|create|implement|write)\\b.*\\b(?:component|widget)\\b"]
instructions = "Ask the UI builder to implement the requested component, preserving the stack, visual constraints, interaction states, responsiveness and accessibility. Distinguish functional UI from an image mockup and verify behavior."
examples = ["Build a React component for sign in", "Create a reusable search widget", "Implement a dialog component", "Write a tab component with keyboard support"]
negatives = ["Explain this component", "Generate an image of a dashboard"]
suppresses = ["code.implement", "writing.draft"]
rewrite = "Build a React component for sign in.\nStep 1: Inspect the existing stack, design conventions, and authentication interface.\nStep 2 (after 1): Implement the requested component with relevant states, keyboard accessibility, and tests.\nLoop: if the completion criteria are not met, return to Step 2 (max 2 rounds).\nDone when: The sign-in component meets the request and relevant checks pass or verification limits are explained."

