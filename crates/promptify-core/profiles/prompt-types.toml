status = "enabled"
form = "graph"
patterns = ["\\bdebug\\b", "\\b(?:fix|diagnose|investigate|reproduce)\\b.*\\b(?:bug|crash|exception|error|defect)\\b"]
instructions = "Ask the agent to reproduce the issue, identify the root cause from evidence, make a scoped fix, and verify with a regression test. Preserve exact errors and expected behavior."
