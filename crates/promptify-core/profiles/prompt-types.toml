patterns = ["\\b(?:build|create|implement|write)\\b.*\\b(?:component|widget)\\b"]
instructions = "Ask the UI builder to implement the requested component, preserving the stack, visual constraints, interaction states, responsiveness and accessibility. Distinguish functional UI from an image mockup and verify behavior."
examples = ["Build a React component for sign in", "Create a reusable search widget", "Implement a dialog component", "Write a tab component with keyboard support"]
