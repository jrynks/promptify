[[task]]
id = "summary.brief"
family = "Summarization and synthesis"
label = "Request a short summary of an article"
inputs = "Source reference, length, audience"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:summari[sz]e|summary|summarization|tl[;:]?dr)\\b"]
instructions = "Ask for a faithful summary of the referenced source. Preserve its scope, qualifications, requested length and audience. Do not supply the summary yourself."
examples = ["Summarize this article in three bullets", "Give me a summary of this chapter", "I need a TLDR of this post", "Summarize the attached report"]
negatives = ["Summarize this meeting", "Create an executive summary"]
rewrite = "Summarize this article in three bullets.\nStep 1: Write three bullets preserving the article's main findings and qualifications without adding facts.\nStep 2 (after 1): Compare each bullet with the article and verify coverage and the requested bullet count.\nLoop: if Step 2 fails the fidelity or bullet-count checks, return to Step 1 to correct omissions, unsupported claims or formatting; then recheck Step 2 (max 2 rounds).\nDone when: three bullets faithfully cover the main findings and qualifications. Stop on passing checks; at the limit report unresolved source gaps."

[[task]]
id = "summary.executive"
family = "Summarization and synthesis"
label = "Request a decision-focused executive summary"
inputs = "Source, decision context, risks"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\bexecutive summary\\b", "\\b(?:summari[sz]e|summary)\\b.*\\b(?:boss|board|leadership|executives)\\b"]
instructions = "Request a decision-focused executive summary grounded in the source, with key findings, implications, risks and unresolved issues as relevant."
examples = ["Create an executive summary", "Summarize this report for my boss", "Write a summary for the board", "Summarize these findings for leadership"]
negatives = ["Summarize this meeting", "Write an email to my boss"]
suppresses = ["summary.brief", "writing.draft"]
rewrite = "Create an executive summary.\nStep 1: Summarize the supplied material's key findings, decision implications, risks and unresolved questions.\nStep 2 (after 1): Verify that the summary's implications and qualifications follow from the source.\nLoop: if Step 2 fails the source fidelity or decision relevance checks, return to Step 1 to revise unsupported implications or missing qualifications; then recheck Step 2 (max 2 rounds).\nDone when: the summary is decision-focused and source-grounded, with risks and unresolved questions explicit. Stop on passing checks; at the limit report gaps."

[[task]]
id = "summary.meeting"
family = "Summarization and synthesis"
label = "Turn a meeting transcript into organized notes"
inputs = "Transcript reference, participants if known"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:summari[sz]e|notes from|recap|summary of)\\b.*\\b(?:meeting|call|conference|discussion)\\b", "\\bmeeting (?:notes|summary|recap)\\b"]
instructions = "Request meeting notes grounded in the transcript, separating discussion, decisions, open questions and actions. Never invent attendees, commitments or deadlines."
examples = ["Summarize this meeting", "Write meeting notes from the transcript", "Recap our conference call", "Give me notes from the discussion"]
negatives = ["Write a meeting invitation email", "Summarize this article"]
suppresses = ["summary.brief", "writing.draft"]
rewrite = "Summarize this meeting.\nStep 1: Separate discussion, decisions, open questions and actions from the supplied meeting material without inventing attendees or commitments.\nStep 2 (after 1): Compare the notes with the source and verify that proposals are not mislabeled as decisions.\nLoop: if Step 2 fails the coverage or decision-fidelity checks, return to Step 1 to correct omissions and mislabeled items; then recheck Step 2 (max 2 rounds).\nDone when: the notes faithfully separate discussion, decisions, questions and actions. Stop on passing checks; at the limit report source ambiguities."

[[task]]
id = "summary.actions"
family = "Summarization and synthesis"
label = "Extract action items without inventing owners or deadlines"
inputs = "Transcript/document, required fields"
priority = "P1"
feasibility = "F1"
status = "enabled"
form = "graph"
patterns = ["\\b(?:extract|identify|list|pull out|find)\\b.*\\b(?:action items|follow[- ]ups|assigned tasks)\\b"]
instructions = "Request action items with explicitly stated owners and deadlines, marking unknown values as unknown. Distinguish commitments from suggestions and retain source references."
examples = ["Extract action items from these notes", "List the assigned tasks from the meeting", "Identify follow-ups in this transcript", "Pull out action items with owners and deadlines"]
negatives = ["Plan a project with tasks", "Summarize the article"]
suppresses = ["summary.brief", "summary.meeting", "extract.fields"]
rewrite = "Extract action items from these notes.\nStep 1: Extract commitments with source references, including owners and deadlines only when stated; mark missing values unknown and distinguish suggestions.\nStep 2 (after 1): Verify that actions, owners and deadlines match the notes and no commitment is invented.\nLoop: if Step 2 fails the commitment or provenance checks, return to Step 1 to correct the extracted items and unknown values; then recheck Step 2 (max 2 rounds).\nDone when: actions have source support, suggestions are distinguished and missing owners or deadlines remain unknown. Stop on passing checks; at the limit report ambiguity."

