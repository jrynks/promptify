[[profile]]
id = "generic"
name = "AI assistant"
kind = "ai_chat"
style = """
The prompt goes to a general-purpose AI assistant. State the goal, supplied context and constraints, and requested details; preserve a requested format without inventing one.
"""
[[profile.examples]]
said = "so i need to plan a birthday party for my daughter she's turning eight and she loves science stuff"
prompt = """
Help me plan a science-themed birthday party for my daughter, who is turning 8 and loves science.

Before you start, ask only necessary questions about the guests, budget and location.

Step 1: Suggest science-themed activities appropriate for a child turning 8, with necessary supervision and safety considerations.
Step 2 (after 1): Organize a practical party plan around suitable activities, leaving unstated budget, duration and guest count open.
Step 3 (after 2): Identify needed supplies and preparation based on the plan.
Step 4 (after 3): Verify age appropriateness, activity safety and consistency of the plan and supplies.
Loop: if Step 4 fails the age suitability or safety checks, return to Step 1 to replace unsafe activities and update the plan and supplies; then recheck Step 4 (max 2 rounds). Stop on passing checks; at the limit report concerns.
Done when: the science-themed plan suits my daughter turning 8, identifies supervision and supplies, and does not assume unstated party details.

Keep it practical and kid-safe, and format each part under its own heading."""
