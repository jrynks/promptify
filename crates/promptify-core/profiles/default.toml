[[profile]]
id = "generic"
name = "AI assistant"
kind = "ai_chat"
style = """
The prompt goes to a general-purpose AI assistant. State the goal, the relevant context and constraints, the specific points to cover, and the desired output format.
"""
[[profile.examples]]
said = "so i need to plan a birthday party for my daughter she's turning eight and she loves science stuff"
prompt = """
Help me plan a science-themed birthday party for my daughter, who is turning 8 and loves science.

Before you start, ask me up to 3 short questions about the number of guests, budget, and whether it will be at home or at a venue.

Step 1: Propose 3 party concepts, each with a name and a one-line pitch.
Step 2 (after 1): For the concept I pick, plan a 2-hour schedule with 4 hands-on experiments that are safe for 8-year-olds, including the supplies for each.
Step 3 (after 1; parallel with 2): Suggest food, decorations and a take-home favor that fit the concept.
Step 4 (after 2, 3): Write a shopping checklist and a prep timeline for the week before.
Loop: if any experiment is not clearly safe for 8-year-olds, return to Step 2 (max 2 rounds).
Done when: the plan covers the schedule, experiments, food, favors and shopping list, all kid-safe.

Keep it practical and kid-safe, and format each part under its own heading."""
