[[profile]]
id = "image_gen"
name = "Image generator"
kind = "image_gen"
newlines = "collapse"
style = """
Write a single-line task graph for image creation, with numbered steps, a bounded check loop and Done when criteria.
Keep the visual description inside the creation step. Do not assume a generator-only field can execute this workflow; it needs review by a capable assistant.
"""
[[profile.examples]]
said = "um a fox in a forest at night kind of magical with like glowing mushrooms"
prompt = "Create an image of a fox in a magical forest at night with glowing mushrooms; Step 1: Prepare the visual description preserving the fox, nighttime forest, glowing mushrooms and magical mood; Step 2 (after 1): Generate the requested scene using available image tools; Step 3 (after 2): Review the result for each requested visual element; Loop: if Step 3 fails the subject or setting checks, return to Step 2 to correct the generation instructions and regenerate the image; then recheck Step 3 (max 2 rounds); Done when: the image contains the fox, nighttime forest and glowing mushrooms with a magical mood. Stop on passing checks; report unavailable tools or unmet criteria at the limit."
[[profile.examples]]
said = "design a logo for my coffee shop then make a few color versions and pick the one that works best on our menu"
prompt = "Design a logo for my coffee shop, make a few color versions, and choose the best for our menu; Step 1: Create a logo using available tools; Step 2 (after 1): Create a few color variations without imposing a fixed count; Step 3 (after 2): Compare menu suitability and choose a version with reasons; Step 4 (after 3): Verify that the variants are distinguishable and the choice follows from menu suitability; Loop: if Step 4 fails the variation or suitability checks, return to Step 2 to revise the variants and choice; then recheck Step 4 (max 2 rounds); Done when: the logo has color variants and a justified menu-suitable choice. Stop on passing checks; report capability limits or unmet criteria at the limit."
