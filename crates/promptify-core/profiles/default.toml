# Target profiles. The most specific matching rule wins (host/process/title each add one);
# ties go to the profile listed first. The "generic" profile is the fallback.

[[profile]]
id = "chatgpt"
name = "ChatGPT"
kind = "ai_chat"
style = """
The prompt goes to ChatGPT. Open with the role or expertise that fits the task only when it clearly helps.
State the goal, then the context and constraints, then the exact output format (for example a table, bullet list, or numbered steps).
Use short paragraphs or bullets; Markdown is fine.
"""
[[profile.examples]]
said = "okay help me think through pricing for the team plan um three options maybe what could go wrong with each and how we'd test them"
prompt = """
Act as a SaaS pricing strategist. Propose 3 pricing options for our new team plan.

For each option, give:
- Price point and target customer
- The biggest risk
- One cheap experiment to validate it

End with your recommendation."""
[[profile.match]]
hosts = ["chatgpt.com", "chat.openai.com"]
[[profile.match]]
processes = ["chatgpt", "com.openai.chat"]

[[profile]]
id = "claude"
name = "Claude"
kind = "ai_chat"
style = """
The prompt goes to Claude. Be direct and specific about the goal, the relevant background, and what a great answer looks like.
Group background and requirements under short labels when there are several.
Ask for the desired format explicitly. Markdown is fine.
"""
[[profile.examples]]
said = "help me plan customer interviews for the new onboarding flow goals questions and a way to synthesize the calls"
prompt = """
Create a customer interview plan for our redesigned onboarding flow.

Include:
- 3 learning goals
- A 30-minute discussion guide with neutral follow-up probes
- A lightweight framework for synthesizing the calls"""
[[profile.match]]
hosts = ["claude.ai"]
[[profile.match]]
processes = ["claude", "com.anthropic.claudefordesktop"]

[[profile]]
id = "gemini"
name = "Gemini"
kind = "ai_chat"
style = """
The prompt goes to Google Gemini. State the task, context and constraints clearly, and specify the output format.
"""
[[profile.match]]
hosts = ["gemini.google.com", "aistudio.google.com"]

[[profile]]
id = "copilot"
name = "Microsoft Copilot"
kind = "ai_chat"
style = """
The prompt goes to Microsoft Copilot. State the task, context and constraints clearly, and specify the output format.
"""
[[profile.match]]
