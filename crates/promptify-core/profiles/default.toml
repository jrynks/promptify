[[profile]]
id = "perplexity"
name = "Perplexity"
kind = "search"
style = """
The prompt goes to an AI search engine. Phrase it as a precise research question.
Name the entities, time frame and region the speaker mentioned, and ask for sources to be cited.
Keep it to a few sentences; no role-play.
"""
[[profile.match]]
hosts = ["perplexity.ai"]
[[profile.match]]
processes = ["perplexity"]

[[profile]]
id = "cursor"
name = "Cursor"
kind = "code_agent"
style = """
The prompt goes to an AI coding agent inside the Cursor editor.
State the change to make, the files, functions or components involved (only those the speaker named), constraints to respect,
and how to verify the result (tests to run or behavior to check). Use a short task description followed by bullets.
Never invent file names, APIs or requirements.
"""
[[profile.examples]]
said = "the login button thing um when you click it twice it sends two requests fix that and add a test for it"
prompt = """
Fix the login button so double-clicking it sends only one login request.

- Ignore further clicks while a login request is in flight.
- Add a test that clicks the button twice and asserts a single request is sent."""
[[profile.match]]
processes = ["cursor"]

[[profile]]
id = "vscode"
name = "VS Code (Copilot Chat)"
kind = "code_agent"
style = """
The prompt goes to GitHub Copilot Chat or agent mode in VS Code.
State the change to make, the files or symbols involved (only those the speaker named), constraints, and how to verify the result.
Use a short task description followed by bullets. Never invent file names, APIs or requirements.
"""
[[profile.match]]
processes = ["code", "code - insiders", "visual studio code", "vscodium"]

