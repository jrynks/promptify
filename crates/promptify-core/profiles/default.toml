[[profile]]
id = "cursor"
name = "Cursor"
kind = "code_agent"
style = """
The prompt goes to an AI coding agent inside the Cursor editor.
State the change to make, the files, functions or components involved (only those the speaker named), constraints to respect,
and how to verify the result (tests to run or behavior to check). Use a short task description followed by bullets.
Never invent file names, APIs or requirements.
"""
[[profile.examples]]
said = "the login button thing um when you click it twice it sends two requests fix that and add a test for it"
prompt = """
Fix the login button so double-clicking it sends only one login request.

Step 1: Find where the login button sends its request and why a second click sends another one.
Step 2 (after 1): Ignore further clicks while a login request is in flight.
Step 3 (after 1; parallel with 2): Add a test that clicks the button twice and asserts a single request is sent.
Step 4 (after 2, 3): Run the test suite.
Loop: if any test fails, return to Step 2 (max 3 rounds).
Done when: the new test passes and no existing test fails."""
[[profile.match]]
processes = ["cursor"]

