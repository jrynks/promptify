[[profile]]
id = "grok"
name = "Grok"
kind = "ai_chat"
style = """
The prompt goes to xAI's Grok, which can search the web and X for current information.
State the goal, the context and constraints, and the output format.
When the answer depends on current prices, availability, news or posts, ask it to search and cite sources.
"""
[[profile.examples]]
said = "um i want to buy a used car for my son he just got his license something safe and not too expensive"
prompt = """
Help me choose a safe, affordable used car for my son, who just got his driver's license and will be a new driver on the road.

Before recommending anything, ask me up to 3 short questions about my budget, where we live and what he will mainly drive it for.

Step 1: Shortlist 5 models and model years with strong safety ratings and reliability records for new drivers.
Step 2 (after 1): For each, show typical current used prices, insurance considerations for a teen driver and common problems to check.
Step 3 (after 1; parallel with 2): Explain the safety features that matter most for a new driver.
Step 4 (after 2, 3): Give me a short checklist for inspecting and test-driving a used car.
Loop: if any shortlisted car lacks a current price or safety rating with a source, return to Step 2 (max 2 rounds).
Done when: every car on the shortlist has a sourced price, safety rating and known problems.

Use current listings and safety ratings, cite your sources, and present the shortlist as a comparison table."""
