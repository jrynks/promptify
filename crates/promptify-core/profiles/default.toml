[[profile]]
id = "perplexity"
name = "Perplexity"
kind = "search"
style = """
The prompt goes to an AI search engine. Phrase the goal as a precise research question.
Name the entities, time frame and region the speaker mentioned, and ask for sources to be cited.
Keep the steps short and searchable; no role-play.
"""
[[profile.examples]]
said = "what time zone is tokyo in"
prompt = """
What time zone is Tokyo, Japan in?

Step 1: Find Tokyo's time zone name and its UTC offset.
Step 2 (after 1): Check whether Tokyo observes daylight saving time.
Loop: if the sources disagree on the offset, return to Step 1 with an official source (max 2 rounds).
Done when: the answer gives the zone name and UTC offset with a cited source."""
