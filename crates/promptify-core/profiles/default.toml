# Target profiles. The most specific matching rule wins: a site (host) match outranks a
# process + window-title match, which outranks a process or title alone. Ties go to the
# profile listed first. The "generic" profile is the fallback.
# Browser title rules cover browsers whose address bar cannot be read (e.g. Zen, or any
# browser on Linux); window titles end with the page title, such as "Grok — Zen Browser".

[[profile]]
id = "chatgpt"
name = "ChatGPT"
kind = "ai_chat"
style = """
The prompt goes to ChatGPT. Open with the goal, then the context and constraints, then the exact output format (for example a table, bullet list, or numbered steps).
Use short paragraphs or bullets; Markdown is fine.
"""
[[profile.examples]]
said = "okay help me think through pricing for the team plan um come up with three options figure out what could go wrong with each and how we'd test them then recommend one"
prompt = """
I need to choose a pricing model for our new team plan. Help me compare options, their risks and how to test them before we commit.

Before you start, ask me up to 3 questions about our product, current customers and competitors if the answer depends on them.

Step 1: Propose 3 distinct pricing options, with how each is priced and who it suits best.
Step 2 (after 1): For each option, estimate the effect on conversion and expansion revenue and name its biggest risk.
Step 3 (after 1; parallel with 2): For each option, design one cheap experiment we could run in 2 weeks to validate it.
Step 4 (after 2, 3): Recommend one option and the 2 metrics to watch in the first 30 days.
Loop: if the recommended option's biggest risk has no way to test it, return to Step 3 (max 2 rounds).
Done when: every option has a risk and an experiment, and the recommendation follows from them.

Format: a comparison table of the 3 options, then the recommendation in a short paragraph."""
[[profile.match]]
hosts = ["chatgpt.com", "chat.openai.com"]
[[profile.match]]
processes = ["chatgpt", "com.openai.chat", "com.openai.chatgpt"]
[[profile.match]]
processes = ["zen", "firefox", "librewolf", "floorp", "waterfox", "chrome", "google chrome", "chromium", "msedge", "microsoft edge", "brave", "brave browser", "vivaldi", "opera", "arc", "safari", "thorium", "comet"]
title = '\bchatgpt\b'

[[profile]]
id = "claude"
name = "Claude"
kind = "ai_chat"
style = """
The prompt goes to Claude. Be direct and specific about the goal, the relevant background, and what a great answer looks like.
Group background and requirements under short labels when there are several.
Ask for the desired format explicitly. Markdown is fine.
"""
[[profile.examples]]
said = "help me plan customer interviews for the new onboarding flow goals questions and a way to synthesize the calls"
prompt = """
Help me plan customer interviews for our redesigned onboarding flow, so we learn what to change next.

If you need details about the product or the changes we made, ask me before writing the guide.

Step 1: Define 3 learning goals, each tied to a decision we could make from the answers.
Step 2 (after 1): Write a 30-minute discussion guide with open, neutral questions and follow-up probes that cover every goal.
Step 3 (after 1; parallel with 2): Set screening criteria for who to recruit.
Step 4 (after 2): Describe a lightweight way to synthesize the calls into themes and next steps.
Loop: if any learning goal has no question in the guide, return to Step 2 (max 2 rounds).
Done when: every goal maps to questions in the guide and to a decision.

Format: a heading for each part, with the guide in the order I would run the call."""
