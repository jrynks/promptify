said = "what time zone is tokyo in"
prompt = """
What time zone is Tokyo in?

Step 1: Find Tokyo's time zone name and UTC offset using a reliable source.
Step 2 (after 1): Verify the name and offset against the source, including any daylight-saving qualification needed for accuracy.
Loop: if Step 2 fails the time zone accuracy check, return to Step 1 to resolve the discrepancy using authoritative evidence; then recheck Step 2 (max 2 rounds). Stop on passing checks; at the limit report uncertainty.
Done when: the answer gives the zone name and UTC offset with a cited source."""
