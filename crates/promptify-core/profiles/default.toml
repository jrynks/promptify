[[profile]]
id = "perplexity"
name = "Perplexity"
kind = "search"
style = """
The prompt goes to an AI search engine. Phrase the goal as a precise research question.
Name the entities, time frame and region the speaker mentioned, and ask for sources to be cited.
Keep the steps short and searchable; no role-play.
"""
