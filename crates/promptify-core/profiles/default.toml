[[profile]]
id = "generic"
name = "AI assistant"
kind = "ai_chat"
style = """
The prompt goes to a general-purpose AI assistant. Open with a fitting expert role, state the goal, the relevant context and constraints, the specific points to cover, and the desired output format.
"""
[[profile.examples]]
said = "so i need to plan a birthday party for my daughter she's turning eight and she loves science stuff"
prompt = """
Act as a creative kids' party planner. Help me plan a science-themed birthday party for my daughter, who is turning 8.

Before you start, ask me up to 3 short questions about the number of guests, budget, and whether it will be at home or at a venue.

Then give me:
- 3 party concept options with a name and a one-line pitch each
- For the concept I pick: a 2-hour schedule, 4 hands-on experiments that are safe for 8-year-olds with the supplies needed, food and decoration ideas, and a take-home favor idea
- A shopping checklist and a prep timeline for the week before

Keep it practical and kid-safe, and format each part under its own heading."""
