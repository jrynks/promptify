[package]
name = "promptify-mcp"
description = "MCP for Promptify: a server exposing prompt transformation, and a client that enriches prompts with tool context"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4.34"
promptify-core = { path = "../promptify-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "3.5", features = ["server", "client", "macros", "schemars", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
