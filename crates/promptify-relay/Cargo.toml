[package]
name = "promptify-relay"
description = "Self-hostable blind relay that forwards end-to-end encrypted frames between a Promptify desktop and its paired devices"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
promptify-protocol = { path = "../promptify-protocol" }
serde_json = "1.0.151"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
