[package]
name = "promptify-server"
description = "Promptify desktop server: paired-device sessions over a blind relay or direct link, and the local API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4.34"
mdns-sd = "0.13"
sha2 = "0.10"
promptify-core = { path = "../promptify-core" }
promptify-protocol = { path = "../promptify-protocol" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
promptify-relay = { path = "../promptify-relay" }
tempfile = "3"
