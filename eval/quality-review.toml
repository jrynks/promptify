# Synthetic evaluation corpus. Prompt cases are the nine previously graded originals;
# held-out requests target new fidelity failures. No personal history or native paste.
[[prompt]]
id = "o01"
category = "simple"
said = "Explain why the sky looks blue."
process = "chrome"
url = "https://chatgpt.com"

[[prompt]]
id = "o02"
category = "coding_double_click"
said = "The login button sends two requests when clicked twice. Fix that and add a regression test, then run the relevant tests. Do not change the API."
process = "code"

