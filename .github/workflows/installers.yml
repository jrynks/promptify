name: Installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/installers.yml
      - scripts/build-env.mjs
      - scripts/installer.mjs
      - scripts/verify-installers.mjs
      - scripts/verify-installers.test.mjs
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json

# Installers are retained as workflow artifacts, never published as a release.
permissions:
  contents: read

# A newer push to the same PR (or ref) supersedes in-flight native builds.
concurrency:
  group: installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS
            os: windows-2022
            artifact: promptify-windows-x64-nsis
            target-dir: 'C:\ptb'
          - name: Linux x64 deb rpm AppImage (glibc 2.35)
            os: ubuntu-22.04
            artifact: promptify-linux-x64-installers
            target-dir: target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ matrix.target-dir }}
      CARGO_TERM_COLOR: always
      # PRs build their exact head, not GitHub's synthetic merge commit.
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      # Keep sidecar/CLI bytes unchanged by linuxdeploy for payload verification.
      NO_STRIP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Confirm checked-out source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build and package inspection prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo curl -fL --retry 3 https://packages.lunarg.com/lunarg-signing-key-pub.asc -o /usr/share/keyrings/lunarg.asc
          echo 'deb [signed-by=/usr/share/keyrings/lunarg.asc] https://packages.lunarg.com/vulkan/1.3.290 jammy main' \
            | sudo tee /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list
          sudo apt-get update
          # Jammy's 1.3.204 headers are too old for ggml; pin the matching LunarG headers/loader.
          vulkan_pkg=1.3.290.0~rc1-1lunarg22.04-1
          sudo apt-get install -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            libvulkan1="$vulkan_pkg" libvulkan-dev="$vulkan_pkg" vulkan-headers="$vulkan_pkg" \
            vulkan-tools="$vulkan_pkg" spirv-headers="1.6.1+$vulkan_pkg" shaderc \
            git curl ca-certificates python3-pip \
            clang libclang-dev llvm-dev ninja-build \
            libx11-dev libxtst-dev libxi-dev libxkbcommon-dev libxdo-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev libxfixes-dev \
            patchelf rpm cpio binutils file
          # Jammy's CMake 3.22 is too old; pin a 3.x release instead of using CMake 4.
          python3 -m pip install --user cmake==3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"
          libclang="$(find /usr/lib/llvm-* -name libclang.so -print -quit)"
          test -n "$libclang"
          echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1 alsa vulkan
          grep -Eq '^#define VK_HEADER_VERSION 290$' /usr/include/vulkan/vulkan_core.h
          test -f /usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake
          git --version
          glslc --version

      - name: Install Windows Vulkan SDK and libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Use an official versioned installer; do not depend on a stale runner SDK.
          $version = '1.4.321.1'
          $sdk = "C:\VulkanSDK\$version"
          $installer = Join-Path $env:GITHUB_WORKSPACE 'VulkanSDK-Installer.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Vulkan SDK installer signature is not valid: $($signature.Status)" }
          $install = Start-Process $installer -ArgumentList @('--root', $sdk, '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($install.ExitCode)" }
          Remove-Item $installer
          $clang = 'C:\Program Files\LLVM\bin'
          # Prefer the runner's LLVM; installing an older pinned package can fail as a downgrade.
          if (-not (Test-Path "$clang\libclang.dll")) {
            choco install llvm --version=18.1.8 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed' }
          }
          foreach ($required in @("$sdk\Bin\glslc.exe", "$sdk\Include\vulkan\vulkan.h", "$sdk\Lib\vulkan-1.lib", "$clang\libclang.dll")) {
            if (-not (Test-Path $required)) { throw "Missing build prerequisite: $required" }
          }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$clang" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          $clang >> $env:GITHUB_PATH
          & "$sdk\Bin\glslc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan shader compiler is not runnable' }
          Get-Command cmake, 7z

      - name: Use public npm tarballs without changing locked versions or integrity
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const mirror = 'https://ms-feed-25.pkgs.visualstudio.com/1es-public/_packaging/npm-public/npm/registry/';
          let count = 0;
          for (const pkg of Object.values(lock.packages)) {
            if (pkg.resolved?.startsWith(mirror)) {
              pkg.resolved = `https://registry.npmjs.org/${pkg.resolved.slice(mirror.length)}`;
              count++;
            }
          }
          writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          console.log(`Mapped ${count} mirror tarballs to public npm; versions and integrity unchanged.`);
          JS

      - name: Record build toolchain
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: npm ci

      - name: Test installer verification
        run: node --test scripts/verify-installers.test.mjs

      - name: Test core pipeline and desktop library
        run: cargo test --locked --release -p promptify-core -p promptify --lib

      - name: Build host installers
        run: npm run installer

      - name: Inspect installer payloads and executable layout
        id: verify
        run: node scripts/verify-installers.mjs

      - name: Upload verified installers only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*-setup.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/deb/*.deb
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/rpm/*.rpm
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/appimage/*.AppImage
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed payload inspection report
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.SOURCE_COMMIT }}-validation-failure
          path: ${{ env.CARGO_TARGET_DIR }}/release/bundle/verification.json
          if-no-files-found: warn
          retention-days: 30
