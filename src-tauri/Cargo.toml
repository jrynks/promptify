[package]
name = "promptify"
description = "Local voice-to-prompt desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "promptify"

[lib]
name = "promptify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
mobile-networking = ["promptify-server/mobile-networking"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
cpal = "0.18.2"
dirs = "7.0.0"
enigo = "0.6.1"
hound = "3.5.1"
log = "0.4.34"
promptify-core = { path = "../crates/promptify-core" }
promptify-mcp = { path = "../crates/promptify-mcp" }
promptify-protocol = { path = "../crates/promptify-protocol" }
promptify-server = { path = "../crates/promptify-server" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
whisper-rs = { version = "0.16.0", features = ["raw-api"] }
x-win = "5.8.0"

# GPU by default; whisper.cpp falls back to the CPU when no capable device exists.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
futures-util = "0.3"
x11rb = { version = "0.13.2", features = ["xinput"] }
zbus = "5.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
